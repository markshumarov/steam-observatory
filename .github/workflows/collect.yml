name: collect

# Ежедневное обновление данных без ручных запусков.
# Тяжёлый опрос CCU во время фестиваля сюда НЕ входит: он идёт часами,
# поэтому для приватного репозитория лимит минут Actions быстро закончится
# (2000 минут/мес). Варианты: запускать poll_ccu_loop.py локально,
# на своём сервере или сделать репозиторий публичным (тогда минуты бесплатны).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Полный конвейер
        run: python scripts/run_all.py --fast --slug oct2026

      - name: Коммит обновлённых данных
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data site/data docs
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "data: ежедневное обновление"
            git push
          fi
